name: Update Prices

on:
  schedule:
    # 週一~五：每 5 分鐘，13:00-21:00 UTC（美股盤中）
    - cron: '*/5 13-21 * * 1-5'
    # 週六日：每 15 分鐘，全天（BTC 24/7 交易）
    - cron: '*/15 * * * 0,6'
  workflow_dispatch:   # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance>=0.2.40

      - name: Fetch prices
        run: python data/update_prices.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "chore: auto-update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
