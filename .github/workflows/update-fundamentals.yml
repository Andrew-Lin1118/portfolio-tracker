name: Update Fundamentals Data

on:
  schedule:
    # 每小時輕量刷新（SYMBOL_REFRESH_ONLY=1）：只更新 fundamentals.json（PE/FPE/EPS 等）
    # 與 earnings_analysis.json，跳過 market_pe / economic / fedwatch / etf_holdings /
    # taiex_weights 附屬任務，把單輪時間壓到最短，讓 FPE 每小時都是最新。
    # 避開整點（GitHub 排程尖峰延遲最嚴重），用 :07 分。
    - cron: '7 * * * *'
    # 每 4 小時完整跑一次附屬任務（大盤 PE / FRED 經濟指標 / FedWatch / ETF 持股 / 台指權重）。
    # 公開 repo 標準 runner 分鐘數免費不限量，頻率主要受外部來源 rate limit 約束。
    - cron: '37 */4 * * *'
  workflow_dispatch:               # 允許手動觸發（= 完整模式）

concurrency:
  group: update-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 允許 push fundamentals.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # beautifulsoup4 → fetch_stockanalysis.py 的 stockanalysis.com fallback 用
        run: pip install 'yfinance>=0.2.40' curl_cffi pandas lxml pytz beautifulsoup4

      - name: Fetch fundamentals
        env:
          # 每小時排程 → 輕量模式；每 4 小時排程與手動觸發 → 完整模式
          SYMBOL_REFRESH_ONLY: ${{ github.event.schedule == '7 * * * *' && '1' || '0' }}
        run: python data/update_fund.py

      - name: Commit & push updated data
        run: |
          set +e   # 容許後面的 git add 對不存在檔案失敗
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # update_fund.py 末尾會順便跑 fetch_market_pe.py + fetch_economic.py
          # 用「檔案存在才 add」的方式，避免某個 fetch 失敗導致整步 fail
          for f in data/fundamentals.json data/market_pe.json data/economic_data.json data/earnings_analysis.json data/etf_holdings.json data/fedwatch.json data/taiex_weights.json; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "  added: $f"
            else
              echo "  skip (not exists): $f"
            fi
          done
          set -e
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          git commit -m "chore: auto-update fundamentals $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "All push attempts failed" && exit 1
