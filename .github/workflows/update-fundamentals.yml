name: Update Fundamentals Data

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'   # UTC 0/6/12/18 點 = 台灣 8/14/20/02 點
  workflow_dispatch:               # 允許手動觸發

concurrency:
  group: update-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 允許 push fundamentals.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance>=0.2.40 pandas lxml pytz

      - name: Fetch fundamentals
        run: python data/update_fund.py

      - name: Commit & push updated data
        run: |
          set +e   # 容許後面的 git add 對不存在檔案失敗
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # update_fund.py 末尾會順便跑 fetch_market_pe.py + fetch_economic.py
          # 用「檔案存在才 add」的方式，避免某個 fetch 失敗導致整步 fail
          for f in data/fundamentals.json data/market_pe.json data/economic_data.json data/earnings_analysis.json data/etf_holdings.json; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "  added: $f"
            else
              echo "  skip (not exists): $f"
            fi
          done
          set -e
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          git commit -m "chore: auto-update fundamentals $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "All push attempts failed" && exit 1
