name: Update Prices

on:
  schedule:
    # 每 5 分鐘，週一~五 13:00-21:00 UTC（涵蓋美東 DST/非 DST 開盤 9:30AM-4PM）
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:   # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance>=0.2.40

      - name: Fetch prices
        run: python data/update_prices.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "chore: auto-update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
