name: Update Fundamentals Data

on:
  schedule:
    # 改為每 2 小時（UTC 偶數點）一次。原本 6 小時會讓剛公布的財報最久要等 6 小時才更新。
    # 美股盤後 16:00 ET (20:00 UTC) 公布的財報，最遲在 22:00 UTC 那輪會被抓到。
    # update_fund.py 內部 ThreadPoolExecutor (max_workers=6) 把 42 標的處理時間壓到 ~40 秒。
    # 12 runs/day × ~2 min ≈ 720 min/month，遠低於 GitHub Actions 公開 repo 的 2000 min 配額。
    - cron: '0 */2 * * *'
  workflow_dispatch:               # 允許手動觸發

concurrency:
  group: update-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 允許 push fundamentals.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # beautifulsoup4 → fetch_stockanalysis.py 的 stockanalysis.com fallback 用
        run: pip install yfinance>=0.2.40 pandas lxml pytz beautifulsoup4

      - name: Fetch fundamentals
        run: python data/update_fund.py

      - name: Commit & push updated data
        run: |
          set +e   # 容許後面的 git add 對不存在檔案失敗
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # update_fund.py 末尾會順便跑 fetch_market_pe.py + fetch_economic.py
          # 用「檔案存在才 add」的方式，避免某個 fetch 失敗導致整步 fail
          for f in data/fundamentals.json data/market_pe.json data/economic_data.json data/earnings_analysis.json data/etf_holdings.json data/fedwatch.json; do
            if [ -f "$f" ]; then
              git add "$f"
              echo "  added: $f"
            else
              echo "  skip (not exists): $f"
            fi
          done
          set -e
          if git diff --cached --quiet; then
            echo "No changes; skipping commit."
            exit 0
          fi
          git commit -m "chore: auto-update fundamentals $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "All push attempts failed" && exit 1
